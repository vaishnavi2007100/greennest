{% extends "store/Admin/AdminMaster.html" %}

{% block title %}
Edit Subcategory | GreenNest Admin
{% endblock %}

{% block page_heading %}
Edit Subcategory
{% endblock %}

{% block content %}

<div class="container-fluid">


<div class="card border-0 shadow-sm">

    <div class="card-header bg-success text-white
                d-flex justify-content-between
                align-items-center">

        <h5 class="mb-0">

            <i class="bi bi-pencil-square"></i>

            Edit Subcategory

        </h5>

        <a
            href="{% url 'AdminSubcategorylist' %}"
            class="btn btn-light btn-sm">

            <i class="bi bi-arrow-left"></i>

            Back

        </a>

    </div>


    <div class="card-body">

        <form method="POST">

            {% csrf_token %}


            <!-- CATEGORY -->

            <div class="mb-3">

                <label class="form-label fw-semibold">

                    Category

                </label>

                <select
                    name="category_id"
                    class="form-select"
                    required>

                    <option value="">
                        Select Category
                    </option>

                    {% for category in categories %}

                    <option
                        value="{{ category.id }}"
                        {% if category.id == subcategory.category_id %}
                        selected
                        {% endif %}>

                        {{ category.category_name }}

                    </option>

                    {% endfor %}

                </select>

            </div>


            <!-- SUBCATEGORY NAME -->

            <div class="mb-3">

                <label class="form-label fw-semibold">

                    Subcategory Name

                </label>

                <input
                    type="text"
                    name="subcategory_name"
                    class="form-control"
                    value="{{ subcategory.subcategory_name }}"
                    placeholder="Enter subcategory name"
                    required>

            </div>


            <!-- DESCRIPTION -->

            <div class="mb-3">

                <label class="form-label fw-semibold">

                    Description

                </label>

                <textarea
                    name="description"
                    class="form-control"
                    rows="4"
                    placeholder="Enter description">{{ subcategory.description }}</textarea>

            </div>


            <!-- STATUS -->

            <div class="mb-4">

                <label class="form-label fw-semibold">

                    Status

                </label>

                <select
                    name="status"
                    class="form-select">

                    <option
                        value="Active"
                        {% if subcategory.status == "Active" %}
                        selected
                        {% endif %}>

                        Active

                    </option>

                    <option
                        value="Inactive"
                        {% if subcategory.status == "Inactive" %}
                        selected
                        {% endif %}>

                        Inactive

                    </option>

                </select>

            </div>


            <!-- BUTTONS -->

            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-success">

                    <i class="bi bi-check-circle"></i>

                    Update Subcategory

                </button>


                <a
                    href="{% url 'AdminSubcategorylist' %}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>


</div>

{% endblock %}
