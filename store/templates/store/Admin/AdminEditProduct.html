{% extends "store/Admin/AdminMaster.html" %}

{% block title %}Edit Product | GreenNest Admin{% endblock %}

{% block page_heading %}Edit Product{% endblock %}

{% block content %}

<style>
    .form-card {
        background: white;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 8px 30px rgba(18,55,42,.08);
    }

    .form-label {
        font-weight: 600;
        color: #12372a;
    }
</style>

<div class="form-card">

    {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="row g-4">

            <div class="col-md-6">

                <label class="form-label">
                    Product Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ product.name }}"
                    required
                >

            </div>

            <div class="col-md-6">

                <label class="form-label">
                    Vendor Email
                </label>

                <input
                    type="email"
                    name="vendor_email"
                    class="form-control"
                    value="{{ product.vendor_email }}"
                    required
                >

            </div>

            <div class="col-md-6">

                <label class="form-label">
                    Category
                </label>

                <input
                    type="text"
                    name="category"
                    class="form-control"
                    value="{{ product.category }}"
                    required
                >

            </div>

            <div class="col-md-6">

                <label class="form-label">
                    Subcategory
                </label>

                <input
                    type="text"
                    name="subcategory"
                    class="form-control"
                    value="{{ product.subcategory }}"
                >

            </div>

            <div class="col-md-6">

                <label class="form-label">
                    Price
                </label>

                <input
                    type="number"
                    step="0.01"
                    name="price"
                    class="form-control"
                    value="{{ product.price }}"
                    required
                >

            </div>

            <div class="col-md-6">

                <label class="form-label">
                    Old Price
                </label>

                <input
                    type="number"
                    step="0.01"
                    name="old_price"
                    class="form-control"
                    value="{{ product.old_price }}"
                >

            </div>

            <div class="col-md-6">

                <label class="form-label">
                    Stock
                </label>

                <input
                    type="number"
                    name="stock"
                    class="form-control"
                    value="{{ product.stock }}"
                    required
                >

            </div>

            <div class="col-md-6">

                <label class="form-label">
                    Status
                </label>

                <select
                    name="status"
                    class="form-select"
                >

                    <option value="Active"
                        {% if product.status|lower == "active" %}
                            selected
                        {% endif %}
                    >
                        Active
                    </option>

                    <option value="Inactive"
                        {% if product.status|lower == "inactive" %}
                            selected
                        {% endif %}
                    >
                        Inactive
                    </option>

                </select>

            </div>

            <div class="col-12">

                <label class="form-label">
                    Description
                </label>

                <textarea
                    name="description"
                    class="form-control"
                    rows="5"
                >{{ product.description }}</textarea>

            </div>

        </div>

        <div class="mt-4">

            <button
                type="submit"
                class="btn btn-success px-4"
            >
                <i class="bi bi-check-circle me-2"></i>
                Update Product
            </button>

            <a
                href="{% url 'AdminProductlist' %}"
                class="btn btn-outline-secondary px-4"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
