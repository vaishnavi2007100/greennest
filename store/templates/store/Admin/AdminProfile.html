{% extends "store/Admin/AdminMaster.html" %}

{% block title %}
Admin Profile | GreenNest
{% endblock %}

{% block page_heading %}
Admin Profile
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow-sm border-0">

        <div class="card-header bg-success text-white">
            <h5 class="mb-0">
                <i class="bi bi-person-circle"></i>
                Admin Profile
            </h5>
        </div>

        <div class="card-body">

            {% if admin %}

            <div class="row">

                <!-- NAME -->
                <div class="col-md-6 mb-3">

                    <label class="form-label fw-semibold">
                        <i class="bi bi-person"></i>
                        Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="Administrator"
                        readonly
                    >

                </div>


                <!-- EMAIL -->
                <div class="col-md-6 mb-3">

                    <label class="form-label fw-semibold">
                        <i class="bi bi-envelope"></i>
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        value="{{ admin.email }}"
                        readonly
                    >

                </div>


                <!-- ROLE -->
                <div class="col-md-6 mb-3">

                    <label class="form-label fw-semibold">
                        <i class="bi bi-shield-check"></i>
                        Role
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ admin.role }}"
                        readonly
                    >

                </div>

            </div>

            {% else %}

            <div class="alert alert-danger">
                Admin account not found.
            </div>

            {% endif %}

        </div>

    </div>

</div>

{% endblock %}
