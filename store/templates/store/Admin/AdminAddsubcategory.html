{% extends "store/Admin/AdminMaster.html" %}

{% block title %}
Add Subcategory | GreenNest Admin
{% endblock %}

{% block page_heading %}
Add Subcategory
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="card border-0 shadow-sm">

        <div class="card-header bg-success text-white">

            <h5 class="mb-0">

                <i class="bi bi-node-plus"></i>

                Add Subcategory

            </h5>

        </div>


        <div class="card-body">

            {% if error %}

            <div class="alert alert-danger">
                {{ error }}
            </div>

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <div class="mb-3">

                    <label class="form-label">
                        Category
                    </label>

                    <select
                        name="category_id"
                        class="form-select"
                        required>

                        <option value="">
                            Select Category
                        </option>

                        {% for category in categories %}

                        <option value="{{ category.id }}">

                            {{ category.category_name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Subcategory Name
                    </label>

                    <input
                        type="text"
                        name="subcategory_name"
                        class="form-control"
                        placeholder="Enter subcategory name"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="4"
                        placeholder="Enter description"></textarea>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Status
                    </label>

                    <select
                        name="status"
                        class="form-select">

                        <option value="Active">
                            Active
                        </option>

                        <option value="Inactive">
                            Inactive
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="btn btn-success">

                    <i class="bi bi-check-circle"></i>

                    Add Subcategory

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
